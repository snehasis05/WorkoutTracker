<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Workouts" />
  <title>Workout Tracker</title>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    h2 { margin: 12px 0 20px; font-size: 1.4rem; text-align: center; }
    .form-group { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 1rem;
    }
    .grid { display: flex; gap: 10px; }
    .grid .form-group { flex: 1; }
    button {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    button:active { background: #2563eb; }
    hr { border: 0; border-top: 1px solid #334155; margin: 24px 0; }
    .log-list { display: flex; flex-direction: column; gap: 8px; }
    .log-item {
      background: #1e293b;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }
    .log-info strong { display: block; font-size: 1rem; }
    .log-info span { color: #94a3b8; font-size: 0.8rem; }
    .del-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1.1rem;
      cursor: pointer;
      width: auto;
      padding: 6px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🏋️ Workout Tracker</h2>

    <form id="workout-form">
      <div class="form-group">
        <label for="exercise">Exercise</label>
        <input type="text" id="exercise" placeholder="e.g. Barbell Squat" required />
      </div>
      <div class="grid">
        <div class="form-group">
          <label for="weight">Weight (kg/lbs)</label>
          <input type="number" id="weight" step="0.5" placeholder="80" required />
        </div>
        <div class="form-group">
          <label for="reps">Reps</label>
          <input type="number" id="reps" placeholder="8" required />
        </div>
      </div>
      <button type="submit" id="save-btn">Log Set</button>
    </form>

    <hr />

    <div class="log-list" id="log-list"></div>
  </div>

  <script>
    // Paste your Supabase project details here:
    const SUPABASE_URL = 'https://bkplhjwykyryijrmnawr.supabase.co/rest/v1/';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrcGxoand5a3lyeWlqcm1uYXdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NDc4MDAsImV4cCI6MjEwNTAyMzgwMH0.kgzeibHF7B5brHAwdzpVfId3nVzrN79A8q-sVu8dE98';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('workout-form');
    const logList = document.getElementById('log-list');

    // Fetch and display workouts
    async function loadWorkouts() {
      const { data, error } = await db
        .from('workouts')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(20);

      if (error) return console.error(error);

      logList.innerHTML = '';
      if (!data || data.length === 0) {
        logList.innerHTML = '<p style="text-align:center; color:#64748b;">No workouts recorded yet.</p>';
        return;
      }

      data.forEach(item => {
        const date = new Date(item.created_at).toLocaleDateString(undefined, {
          month: 'short', day: 'numeric'
        });

        const row = document.createElement('div');
        row.className = 'log-item';
        row.innerHTML = `
          <div class="log-info">
            <strong>${item.exercise}</strong>
            <span>${item.weight} kg/lbs × ${item.reps} reps • ${date}</span>
          </div>
          <button class="del-btn" onclick="deleteWorkout(${item.id})">✕</button>
        `;
        logList.appendChild(row);
      });
    }

    // Add entry
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const exercise = document.getElementById('exercise').value.trim();
      const weight = parseFloat(document.getElementById('weight').value);
      const reps = parseInt(document.getElementById('reps').value, 10);

      const { error } = await db.from('workouts').insert([{ exercise, weight, reps }]);
      if (error) alert(error.message);
      else {
        form.reset();
        loadWorkouts();
      }
    });

    // Delete entry
    window.deleteWorkout = async function(id) {
      await db.from('workouts').delete().eq('id', id);
      loadWorkouts();
    };

    loadWorkouts();
  </script>
</body>
</html>
